name: Render share image
on:
  push:
    branches: [main]
    paths: ['assets/og.svg', '.github/workflows/render-og.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render SVG -> 1200x630 PNG
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin fonts-inter
          rsvg-convert -w 1200 -h 630 assets/og.svg -o assets/og.png
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og.png
          git diff --cached --quiet || (git commit -m "Render share image" && git push)
